[versions]
# ---- AndroidX 基础 ----
coreKtx = "1.18.0"
appcompat = "1.7.1"
activity = "1.13.0"
lifecycle = "2.11.0"
splashscreen = "1.2.0"

# ---- Compose 生态 ----
# Compose BOM + 核心套件（runtime / ui / material3 / tooling 等）已由 SkyBuildLogic 自动注入，
# 版本通过根项目 extra["skyBuild.composeBomVersion"] 覆盖；此处仅保留 BOM 之外的生态库版本。
navigationCompose = "2.9.8"
hiltNavigationCompose = "1.4.0"
pagingCompose = "3.5.0"
coil = "3.5.0"

# ---- 协程 ----
coroutines = "1.11.0"

# ---- 网络 ----
retrofitVersion = "3.0.0"
persistentcookiejar = "v1.0.1"
okhttp = "5.4.0"
chucker = "4.3.1"

# ---- 数据解析 ----
moshi = "1.15.2"

# ---- 存储 ----
datastore = "1.2.1"
mmkv = "2.4.1"

# ---- 日志 / 工具 ----
xlog = "1.11.1"

# ---- Sky 系列库 ----
skymvi = "1.0.0"
skyBuildLogic = "1.2.3"

[libraries]
# ---- AndroidX 基础 ----
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# ---- Lifecycle ----
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
# Compose 侧生命周期感知收集：collectAsStateWithLifecycle / LifecycleResumeEffect
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# ---- Compose 生态库（BOM 之外的额外依赖，仍由消费者自行声明）----
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "pagingCompose" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# ---- 协程 ----
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# ---- Hilt ----
hilt-noop-processor = { group = "com.sky.buildLogic", name = "hilt-noop-processor", version.ref = "skyBuildLogic" }

# ---- 网络 ----
retrofit2-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofitVersion" }
persistentcookiejar = { module = "com.github.franmontiel:PersistentCookieJar", version.ref = "persistentcookiejar" }
okhttp-chucker = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }
okhttp-chucker-release = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }

# ---- 数据解析 ----
moshi = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
moshi-converter = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofitVersion" }

# ---- 存储 ----
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }

# ---- 日志 / 工具 ----
xlog = { module = "com.elvishew:xlog", version.ref = "xlog" }

# ---- Sky 系列库 ----
skymvi = { module = "com.sky.lib:SkyMVI", version.ref = "skymvi" }

[plugins]
sky-android-application = { id = "sky.android.application", version.ref = "skyBuildLogic" }
sky-android-application-flavors = { id = "sky.android.application.flavors", version.ref = "skyBuildLogic" }
sky-android-library = { id = "sky.android.library", version.ref = "skyBuildLogic" }
sky-android-library-common = { id = "sky.android.library.common", version.ref = "skyBuildLogic" }
sky-android-hilt = { id = "sky.android.hilt", version.ref = "skyBuildLogic" }
sky-android-publish = { id = "sky.android.publish", version.ref = "skyBuildLogic" }
